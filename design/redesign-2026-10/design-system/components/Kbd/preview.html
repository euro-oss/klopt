<!-- @dsCard group="Keyboard" height=96 subtitle="Single key, chord, hint bar" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kbd</title></head>
<body style="margin:0">
<div class="k-root" style="padding:20px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <span class="k-kbd">↵</span>
    <span class="k-kbd">Esc</span>
    <span class="k-chord"><span class="k-kbd">G</span><span class="k-kbd">F</span></span>
    <span class="k-chord"><span class="k-kbd">⌘</span><span class="k-kbd">K</span></span>
    <span class="k-kbd">?</span>
  </div>
  <div class="k-hints">
    <span><span class="k-kbd">J</span> <span class="k-kbd">K</span> next, previous</span>
    <span><span class="k-kbd">X</span> select</span>
    <span><span class="k-kbd">↵</span> open</span>
    <span><span class="k-kbd">/</span> filter</span>
    <span><span class="k-kbd">?</span> all shortcuts</span>
  </div>
</div>
<script></script>
</body>
</html>
