<!-- @dsCard group="Forms" height=110 subtitle="Setting on and off" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch</title></head>
<body style="margin:0">
<div class="k-root" style="padding:20px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;gap:14px;align-items:center">
    <span style="flex:1;display:flex;flex-direction:column"><strong>Show accounting detail</strong><span class="k-muted" style="font-size:13px">Ledger numbers, RGS and VAT codes everywhere.</span></span>
    <button type="button" class="k-switch" role="switch" aria-checked="false" aria-label="Show accounting detail"></button>
  </div>
  <div style="display:flex;gap:14px;align-items:center">
    <span style="flex:1"><strong>Round VAT per invoice</strong></span>
    <button type="button" class="k-switch" role="switch" aria-checked="true" aria-label="Round VAT per invoice"></button>
  </div>
</div>
<script>
  document.querySelectorAll('.k-switch').forEach(function (b) {
    b.addEventListener('click', function () { b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); });
  });
</script>
</body>
</html>
