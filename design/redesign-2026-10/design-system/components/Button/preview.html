<!-- @dsCard group="Actions" height=120 subtitle="Primary, secondary, ghost, small, icon" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body style="margin:0">
<div class="k-root" style="padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <button class="k-btn k-btn--primary" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New invoice <span class="k-chord"><span class="k-kbd k-kbd--on-primary">N</span><span class="k-kbd k-kbd--on-primary">F</span></span>
  </button>
  <button class="k-btn" type="button">Add a receipt <span class="k-chord"><span class="k-kbd">N</span><span class="k-kbd">R</span></span></button>
  <button class="k-btn k-btn--ghost" type="button">Cancel</button>
  <button class="k-btn k-btn--sm" type="button">Credit note <span class="k-kbd">C</span></button>
  <button class="k-btn k-btn--sm k-btn--dashed" type="button">+ Add a line</button>
  <button class="k-btn k-btn--icon" type="button" aria-label="More actions"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  <button class="k-btn" type="button" disabled>Send</button>
</div>
<script></script>
</body>
</html>
