<!doctype html>
<html>
<head><meta charset="utf-8"><title>Choice option</title></head>
<body style="margin:0">
<div class="k-root" style="padding:20px;display:flex;flex-direction:column;gap:10px">
  <button type="button" class="k-option is-suggested">
    <span class="k-option-key">1</span>
    <span class="k-option-body"><span class="k-option-title">A cost without a receipt yet</span><span class="k-option-meta k-num">General costs · 21% VAT (€ 6,42 back)</span></span>
    <span class="k-option-tag">Suggested</span>
  </button>
  <button type="button" class="k-option">
    <span class="k-option-key">2</span>
    <span class="k-option-body"><span class="k-option-title">Pays a purchase invoice</span><span class="k-option-meta">Pick from the 5 unpaid supplier invoices</span></span>
  </button>
  <button type="button" class="k-option">
    <span class="k-option-key">3</span>
    <span class="k-option-body"><span class="k-option-title">Transfer to my savings account</span><span class="k-option-meta">Between your own accounts, no VAT</span></span>
  </button>
</div>
<script></script>
</body>
</html>
