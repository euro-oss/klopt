<!-- @dsCard group="Data" height=250 subtitle="Header, rows, keyboard cursor" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>List row</title></head>
<body style="margin:0">
<div class="k-root" style="padding:20px">
  <div class="k-card k-card--flush" role="listbox" aria-label="Sales invoices">
    <div class="k-row k-row--head" style="display:grid;grid-template-columns:92px 1fr 80px 120px 100px">
      <span>Number</span><span>Customer</span><span>Date</span><span>Status</span><span style="text-align:right">Amount</span>
    </div>
    <div class="k-row k-num" role="option" aria-selected="false" style="display:grid;grid-template-columns:92px 1fr 80px 120px 100px">
      <span>2025-0016</span><span>Zandbank Advies</span><span class="k-muted">28 Nov</span><span><span class="k-pill k-pill--paid">Paid</span></span><span style="text-align:right">€ 478,42</span>
    </div>
    <div class="k-row k-num" role="option" aria-selected="true" style="display:grid;grid-template-columns:92px 1fr 80px 120px 100px">
      <span>2025-0040</span><span>Windvaan Workshops</span><span class="k-muted">16 Sep</span><span><span class="k-pill k-pill--late">76 days late</span></span><span style="text-align:right">€ 711,04</span>
    </div>
    <div class="k-row k-num" role="option" aria-selected="false" style="display:grid;grid-template-columns:92px 1fr 80px 120px 100px">
      <span>2025-0025</span><span>Fictieve Fietsen</span><span class="k-muted">31 Aug</span><span><span class="k-pill k-pill--paid">Paid</span></span><span style="text-align:right">€ 1.176,07</span>
    </div>
  </div>
</div>
<script></script>
</body>
</html>
