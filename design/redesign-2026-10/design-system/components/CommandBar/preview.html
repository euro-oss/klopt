<!-- @dsCard group="Keyboard" height=380 subtitle="⌘K: search and act" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Command bar</title></head>
<body style="margin:0">
<div class="k-root" style="padding:24px;background:var(--backdrop);display:flex;justify-content:center">
  <div class="k-cmd" role="dialog" aria-label="Command bar">
    <div class="k-cmd-input">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input aria-label="Search or run a command" value="zand">
      <span class="k-kbd">Esc</span>
    </div>
    <p class="k-cmd-group">Contact</p>
    <div class="k-cmd-item" aria-selected="true"><span class="k-tile" style="width:28px;height:28px">ZA</span><span style="flex:1"><strong>Zand</strong>bank Advies <span class="k-muted">· 4 invoices · € 958,34 overdue</span></span><span class="k-kbd">↵</span></div>
    <p class="k-cmd-group">Do something with it</p>
    <div class="k-cmd-item"><span class="k-tile" style="width:28px;height:28px">+</span><span style="flex:1">New invoice for <strong>Zand</strong>bank Advies</span><span class="k-chord"><span class="k-kbd">⌘</span><span class="k-kbd">↵</span></span></div>
    <div class="k-cmd-foot"><span><span class="k-kbd">↑</span> <span class="k-kbd">↓</span> move</span><span><span class="k-kbd">↵</span> open</span><span><span class="k-kbd">Tab</span> actions</span></div>
  </div>
</div>
<script></script>
</body>
</html>
