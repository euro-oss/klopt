<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klopt phone · VAT periods</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/klopt/tokens.css">
<link rel="stylesheet" href="ds/klopt/components/bundle.css">
</head>
<body>
<!-- Derived board: phone layout of the VAT period list (the left column of the Vat board). -->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--ground)}
a{color:var(--ink)}
.k-root.k-phone{--line-control:var(--ink-muted);overflow:clip}
.k-tabbar{position:sticky;bottom:0;z-index:1}
.lnk{color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-weight:600}
.per{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line-soft);text-decoration:none;color:var(--ink);min-height:60px;box-sizing:border-box}
.per:first-of-type{border-top:0}
.cap{margin:0;padding:14px 16px 6px;font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.nw{white-space:nowrap}
</style>
</helmet>
<div class="k-root k-phone" data-theme="{{theme}}">
  <div class="k-phone-top">
    <h1 style="margin: 0; flex: 1; font-size: 24px; line-height: 30px; font-weight: 600;">VAT</h1>
  </div>
  <div class="k-phone-body">
    <sc-for list="{{years}}" as="y" hint-placeholder-count="2">
      <section class="k-card k-card--flush" aria-label="{{y.label}}">
        <h2 class="cap">{{y.label}}</h2>
        <sc-for list="{{y.rows}}" as="p" hint-placeholder-count="4">
          <a href="{{p.href}}" class="per">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 600;">{{p.q}}</span>
              <span class="k-muted nw" style="font-size: 13px;">{{p.dates}}</span>
              <sc-if value="{{p.note}}" hint-placeholder-val="{{false}}"><span class="nw" style="font-size: 13px; color: var(--ink-2);">{{p.note}}</span></sc-if>
            </span>
            <span class="{{p.cls}}">{{p.status}}</span>
            <span class="k-muted" aria-hidden="true">›</span>
          </a>
        </sc-for>
      </section>
    </sc-for>
    <section class="k-card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px;">
      <strong style="font-size: 15px;">ICP return</strong>
      <span class="k-muted" style="line-height: 1.5;">No sales to EU businesses this quarter, so there is nothing to report.</span>
      <a href="Icp.dc.html" class="lnk" style="display: flex; align-items: center; min-height: 44px;">How a filled ICP return looks</a>
    </section>
  </div>
  <nav class="k-tabbar" aria-label="Main">
    <a class="k-tabbar-item" href="PhoneHome.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a class="k-tabbar-item" href="PhoneSales.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Sales<span class="k-badge k-badge--danger">5</span></a>
    <a class="k-tabbar-item" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Receipt</a>
    <a class="k-tabbar-item" href="PhoneMatch.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>Bank<span class="k-badge k-badge--brand">15</span></a>
    <a class="k-tabbar-item is-active" href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = { open: 'k-pill k-pill--open', late: 'k-pill k-pill--late', draft: 'k-pill k-pill--draft', done: 'k-pill k-pill--paid', none: 'k-muted' };
    // Today is Friday 30 October 2026, as on PhoneHome. A quarter's return is due at the end of the next month.
    const row = (q, dates, status, kind, href, note) => ({ q, dates, status, note: note || '', cls: pill[kind] + ' nw', href: href || '#' });
    const years = [
      { label: '2026', rows: [
        row('Q4', '1 Oct to 31 Dec 2026', 'Opens 1 Jan', 'none', '', 'Running, due 31 Jan 2027'),
        row('Q3', '1 Jul to 30 Sep 2026', 'Due tomorrow', 'open', '', 'Due 31 Oct'),
        row('Q2', '1 Apr to 30 Jun 2026', 'Late', 'late', '', 'Was due 31 Jul'),
        row('Q1', '1 Jan to 31 Mar 2026', 'Late', 'late', '', 'Was due 30 Apr')
      ] },
      { label: '2025', rows: [
        row('Q4', '1 Oct to 31 Dec 2025', 'Late', 'late', 'PhoneVat.dc.html', 'Ready to file, was due 31 Jan 2026'),
        row('Q3', '1 Jul to 30 Sep 2025', 'Marked as filed', 'done'),
        row('Q2', '1 Apr to 30 Jun 2025', 'Marked as filed', 'done'),
        row('Q1', '1 Jan to 31 Mar 2025', 'Marked as filed', 'done')
      ] }
    ];
    return { theme: this.props.theme ?? 'light', years };
  }
}
</script>
</body>
</html>
