<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klopt navigation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/klopt/tokens.css">
<link rel="stylesheet" href="ds/klopt/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav class="k-nav k-root" aria-label="Main" style="min-height: 100%;">
  <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; background: transparent; border-radius: var(--radius-lg); cursor: pointer; text-align: left; font-family: var(--font-sans); color: var(--ink);">
    <span class="k-mark" aria-hidden="true">K</span>
    <span style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
      <span style="font-size: 14px; font-weight: 600;">Demo BV</span>
      <span style="font-size: 12px; color: var(--ink-muted);">Book year 2025</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted);"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
  </button>

  <a href="Command.dc.html" class="k-search" style="height: var(--nav-h); margin: 8px 0 12px; text-decoration: none; border-color: var(--line);">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span style="flex: 1; font-size: 14px;">Search or jump to</span>
    <span class="k-chord"><span class="k-kbd">⌘</span><span class="k-kbd">K</span></span>
  </a>

  <a href="Main.dc.html" class="{{c.home}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span class="k-nav-label">Home</span><span class="k-nav-chord">G D</span>
  </a>
  <a href="Inbox.dc.html" class="{{c.inbox}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>
    <span class="k-nav-label">Inbox</span><span class="k-nav-chord">G E</span>
  </a>
  <a href="Invoices.dc.html" class="{{c.sales}}" aria-label="Sales, 5 overdue invoices">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
    <span class="k-nav-label">Sales</span><span class="k-badge k-badge--danger">5</span>
  </a>
  <a href="Costs.dc.html" class="{{c.costs}}" aria-label="Costs, 40 bills to approve">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v18l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 8h8M8 12h8"/></svg>
    <span class="k-nav-label">Costs</span><span class="k-badge k-badge--neutral">40</span>
  </a>
  <a href="Match.dc.html" class="{{c.bank}}" aria-label="Bank, 15 lines to match">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>
    <span class="k-nav-label">Bank</span><span class="k-badge k-badge--brand">15</span>
  </a>
  <a href="Vat.dc.html" class="{{c.vat}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 5-14 14"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>
    <span class="k-nav-label">VAT</span><span class="k-nav-chord">G G</span>
  </a>
  <a href="Reports.dc.html" class="{{c.reports}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span class="k-nav-label">Reports</span><span class="k-nav-chord">G W</span>
  </a>
  <a href="Contacts.dc.html" class="{{c.contacts}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>
    <span class="k-nav-label">Contacts</span><span class="k-nav-chord">G R</span>
  </a>

  <div style="flex: 1; min-height: 24px;"></div>

  <a href="Settings.dc.html" class="{{c.settings}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span class="k-nav-label">Settings</span><span class="k-nav-chord">G I</span>
  </a>
  <a href="Command.dc.html" class="k-nav-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg>
    <span class="k-nav-label">Shortcuts</span><span class="k-nav-chord">?</span>
  </a>
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 4px; margin-top: 8px; border-top: 1px solid var(--line);">
    <span style="width: 28px; height: 28px; border-radius: var(--radius-pill); background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">H</span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <span style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">hidde@neverhide.nl</span>
      <span style="font-size: 12px; color: var(--ink-muted);">Owner</span>
    </span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","inbox","sales","costs","bank","vat","reports","contacts","settings"],"default":"home"},"$preview":{"width":248,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const keys = ['home','inbox','sales','costs','bank','vat','reports','contacts','settings'];
    const c = {};
    keys.forEach((k) => { c[k] = k === a ? 'k-nav-item is-active' : 'k-nav-item'; });
    return { c };
  }
}
</script>
</body>
</html>
