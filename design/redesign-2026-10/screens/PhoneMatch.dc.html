<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klopt phone · Match</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/klopt/tokens.css">
<link rel="stylesheet" href="ds/klopt/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--ground)}
a{color:var(--ink)}
.k-option{min-height:56px}
</style>
</helmet>
<div class="k-root k-phone" data-theme="{{theme}}" style="height: 844px;">
  <div class="k-phone-top" style="flex-direction: column; align-items: stretch; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 12px;"><h1 style="margin: 0; flex: 1; font-size: 24px; line-height: 30px; font-weight: 600;">Match</h1><span class="k-muted" style="font-size: 13px;">1 of 15</span></div>
    <div style="height: 6px; border-radius: 3px; background: var(--line-soft);"><div style="height: 6px; width: 7%; border-radius: 3px; background: var(--primary);"></div></div>
  </div>
  <div class="k-phone-body" style="overflow: hidden;">
    <section class="k-card" style="padding: 20px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <span class="k-muted k-num" style="font-size: 13px;">20 Oct 2025 · debit</span>
      <span style="font-size: 20px; line-height: 26px; font-weight: 600;">Open post 15 (demo)</span>
      <span style="color: var(--ink-2);">“Ongeboekte demo-kosten 15”</span>
      <span class="k-num" style="font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px;">− € 37,00</span>
    </section>
    <h2 style="margin: 0; font-size: 15px; font-weight: 600; color: var(--ink-2);">What was this?</h2>
    <button type="button" class="k-option is-suggested"><span class="k-option-body"><span class="k-option-title">A cost, receipt later</span><span class="k-option-meta">General costs · 21% VAT</span></span><span class="k-option-tag">Suggested</span></button>
    <button type="button" class="k-option"><span class="k-option-body"><span class="k-option-title">Pays a supplier's bill</span><span class="k-option-meta">Pick from 5 unpaid</span></span></button>
    <button type="button" class="k-option"><span class="k-option-body"><span class="k-option-title">To my savings account</span><span class="k-option-meta">No VAT</span></span></button>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button type="button" class="k-btn" style="height: 44px; justify-content: center;">Snap receipt</button>
      <button type="button" class="k-btn k-btn--ghost" style="height: 44px; justify-content: center;">Skip</button>
    </div>
  </div>
  <nav class="k-tabbar" aria-label="Main">
    <a class="k-tabbar-item" href="PhoneHome.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a class="k-tabbar-item" href="PhoneSales.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Sales<span class="k-badge k-badge--danger">5</span></a>
    <a class="k-tabbar-item" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Receipt</a>
    <a class="k-tabbar-item is-active" href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>Bank<span class="k-badge k-badge--brand">15</span></a>
    <a class="k-tabbar-item" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
