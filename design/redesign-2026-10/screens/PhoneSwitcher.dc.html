<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klopt phone · Switch administration</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/klopt/tokens.css">
<link rel="stylesheet" href="ds/klopt/components/bundle.css">
</head>
<body>
<!--
  Derived board, not drawn by Hidde (#153). Phone layout of Switcher, opened from the administration
  name at the top of PhoneHome, so Home is the active tab. A page rather than a sheet, so nothing
  sits on the tab bar. No key hints on phone. Self-hosted fonts.
-->
<x-dc>
<helmet>
<link rel="stylesheet" href="../design-system/fonts/fonts.css">
<style>
body{margin:0;background:var(--ground)}
a{color:var(--ink)}
.k-root[data-theme]{--line-control:var(--ink-muted)}
.k-root.k-phone{overflow:clip}
.k-tabbar{position:sticky;bottom:0;z-index:1}
.sw-h{margin:0;padding:0 4px;font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.sw-row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;border-top:1px solid var(--line-soft);background:transparent;font:400 15px var(--font-sans);color:var(--ink);text-align:left;text-decoration:none;box-sizing:border-box;cursor:pointer}
.sw-row:first-child{border-top:0}
.sw-row[aria-checked="true"]{background:var(--selection)}
.sw-sub{font-size:13px;line-height:18px;color:var(--ink-muted)}
</style>
</helmet>
<div class="k-root k-phone" data-theme="{{theme}}">
  <div class="k-phone-top">
    <a href="PhoneHome.dc.html" class="k-btn k-btn--ghost" style="height: 44px; padding: 0 8px; margin-left: -8px; text-decoration: none;">‹ Home</a>
  </div>
  <div class="k-phone-body" style="gap: 16px;">
    <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600;">Administration and book year</h1>

    <h2 class="sw-h">Administrations</h2>
    <section class="k-card k-card--flush" role="radiogroup" aria-label="Administrations">
      <sc-for list="{{admins}}" as="a" hint-placeholder-count="2">
        <button type="button" class="sw-row" role="radio" aria-checked="{{a.on}}">
          <span class="k-mark" style="width: 32px; height: 32px; font-size: 14px;" aria-hidden="true">{{a.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;"><strong style="font-weight: 600;">{{a.name}}</strong><span class="sw-sub">{{a.sub}}</span></span>
          <sc-if value="{{a.on === 'true'}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
        </button>
      </sc-for>
      <a href="PhoneSetup.dc.html" class="sw-row">
        <span class="k-tile" style="width: 32px; height: 32px; border-radius: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span style="flex: 1;">New administration</span>
      </a>
    </section>

    <h2 class="sw-h">Book year</h2>
    <section class="k-card k-card--flush" aria-label="Book year">
      <button type="button" class="sw-row" role="radio" aria-checked="true">
        <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">2025</span><span class="sw-sub">1 Jan – 31 Dec · 3 periods closed, 9 open</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <a href="#" class="sw-row">
        <span style="flex: 1; display: flex; flex-direction: column;"><span>Open book year 2026</span><span class="sw-sub">2025 has nowhere to carry its balance yet</span></span>
      </a>
    </section>

    <section class="k-card k-card--flush" aria-label="Account">
      <div class="sw-row" style="cursor: default;">
        <span class="k-tile" style="width: 32px; height: 32px; border-radius: 16px; font-weight: 600;" aria-hidden="true">E</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;"><span class="sw-sub">Signed in as</span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">eva@bakkerij.example</span></span>
      </div>
      <a href="#" class="sw-row"><span style="flex: 1;">People and access</span></a>
      <a href="PhoneSignIn.dc.html" class="sw-row"><span style="flex: 1;">Sign out</span></a>
    </section>
  </div>
  <nav class="k-tabbar" aria-label="Main">
    <a class="k-tabbar-item is-active" href="PhoneHome.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a class="k-tabbar-item" href="PhoneSales.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Sales<span class="k-badge k-badge--danger">5</span></a>
    <a class="k-tabbar-item" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Receipt</a>
    <a class="k-tabbar-item" href="PhoneMatch.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>Bank<span class="k-badge k-badge--brand">15</span></a>
    <a class="k-tabbar-item" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const admins = [
      { ini: 'D', name: 'Demo BV', sub: 'Owner · 2 people', on: 'true' },
      { ini: 'B', name: 'Bakkerij Eva BV', sub: 'Owner · just you', on: 'false' }
    ];
    return { theme: this.props.theme ?? 'light', admins };
  }
}
</script>
</body>
</html>
