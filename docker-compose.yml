# One application container, Postgres, S3-compatible storage. Nothing else is
# required (spec principle 5). This file is the development stack; the
# production compose ships with the release.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: klopt
      POSTGRES_PASSWORD: klopt
      POSTGRES_DB: klopt
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klopt -d klopt']
      interval: 5s
      timeout: 5s
      retries: 10

  # Object lock is a retention requirement (spec 7.6), not a nice-to-have, so
  # the development stack has it on from the start rather than discovering at
  # M5 that the bucket layout cannot support it.
  #
  # Running the tests does not need this. They bring up an S3-compatible
  # object-lock bucket in their own process, and run against this one only when
  # KLOPT_S3_ENDPOINT points at it (ADR 0059). What it is for is running the
  # application against real object storage.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: klopt
      MINIO_ROOT_PASSWORD: klopt-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 klopt klopt-dev-secret &&
      mc mb --ignore-existing --with-lock local/klopt-documents &&
      mc mb --ignore-existing local/klopt-exports &&
      echo 'klopt-exports is a test fixture: a bucket deliberately without'
      echo 'object lock, so verifyLock has something honest to fail against.'
      echo 'Nothing in the application writes to it — see ADR 0032.' &&
      echo 'buckets ready'
      "

volumes:
  postgres-data:
  minio-data:
