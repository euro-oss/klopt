name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Correctness beats availability (spec 12). CI is not allowed to be flaky-green.
  CI: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      # Must come first among the code checks. Type-aware linting resolves
      # cross-package imports through each package's `exports`, which point at
      # dist/, so on a clean checkout there is nothing there to resolve until
      # this step has run.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Architecture boundaries
        run: pnpm run lint:boundaries

  # Placeholder for the checks that make the compliance treadmill survivable
  # (spec 11.4, 16): golden-file artefacts validated against the official schema
  # and schematron, and the reference dataset. They land with the artefacts they
  # validate, from M0 onwards. The job exists now so that adding them is editing
  # a workflow rather than inventing one.
  artefacts:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No regulated artefacts to validate yet. See docs/compliance-calendar.md."
