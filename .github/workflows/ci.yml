name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Correctness beats availability (spec 12). CI is not allowed to be flaky-green.
  CI: true
  DATABASE_URL: postgres://klopt:klopt@localhost:5432/klopt

jobs:
  # DCO (see CONTRIBUTING.md): every non-merge commit on a pull request must
  # carry a Signed-off-by trailer. Merge commits are skipped. Push-to-main is
  # not checked here — branch protection already requires the PR path.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit must be Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            parents=$(git rev-list --parents -n 1 "$sha")
            # merge commits have two or more parents; DCO does not apply to them
            set -- $parents
            if [ "$#" -gt 2 ]; then
              continue
            fi
            body=$(git log -1 --format=%B "$sha")
            if ! printf '%s\n' "$body" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error title=Missing DCO::Commit $sha lacks a Signed-off-by trailer"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done < <(git rev-list --reverse "${BASE}..${HEAD}")
          if [ "$missing" -ne 0 ]; then
            echo "Add a DCO sign-off with: git commit -s (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "DCO sign-off present on every commit in ${BASE}..${HEAD}"

  verify:
    runs-on: ubuntu-latest
    # Healthy verify is ~4.5 min; 20 min caps hung runs without cancelling slow runners.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: klopt
          POSTGRES_PASSWORD: klopt
          POSTGRES_DB: klopt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klopt -d klopt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # xmllint validates generated auditfiles against the published XSD.
      # Preinstalled on ubuntu-latest, but pinned here so a runner image change
      # turns into an install rather than a silently skipped check.
      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # OpenPeppol BIS Schematron is not in the tree (redistribution restricted).
      # Cache by the fetch script so a pin bump busts the cache; fetch is a no-op
      # when both .sch files are already present.
      - name: Cache Peppol BIS-3 Schematron
        uses: actions/cache@v4
        with:
          path: reference-data/peppol/bis-3/*.sch
          key: peppol-bis3-${{ hashFiles('tools/fetch-peppol-bis3.sh') }}

      - name: Fetch Peppol BIS-3 Schematron
        run: pnpm run peppol:fetch

      - name: Format
        run: pnpm run format:check

      # Must come first among the code checks. Type-aware linting resolves
      # cross-package imports through each package's `exports`, which point at
      # dist/, so on a clean checkout there is nothing there to resolve until
      # this step has run.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Migrate
        run: pnpm --filter @klopt/db run migrate

      # The ledger tests run against a real Postgres on purpose. The triggers
      # are half the guarantee, and a mocked database proves nothing about them.
      # The web suite sets its own test encryption key (test/setup/environment.ts)
      # — a committed fixture literal, not a repository secret — so fork PRs and
      # local `pnpm run verify` see the same key CI does.
      #
      # Object storage is the other way round, and deliberately so. There was a
      # `Start MinIO` step here — a container, a health poll and two buckets
      # made with `mc` — and it is gone: the S3 store's specs bring up an
      # S3-compatible object-lock bucket inside the test process, so there is
      # nothing left for it to serve. Nothing here points at S3 either, so the
      # app keeps its filesystem document store.
      #
      # A real bucket proves one thing a local one cannot — that MinIO accepts
      # these signatures — and that is a developer running the same specs with
      # KLOPT_S3_ENDPOINT set, not a container on every push, twice, across the
      # Node matrix. See
      # docs/decisions/0059-a-bucket-close-enough-to-test-against.md.
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # tools/ci-vitest.sh caps wall time and dumps pg_stat_activity on failure
      # so a hung suite fails with diagnostics instead of the job timeout (#232).
      - name: Test
        timeout-minutes: 14
        run: bash tools/ci-vitest.sh

      - name: Architecture boundaries
        run: pnpm run lint:boundaries

  # The compliance treadmill, made survivable (spec 11.4, 16): every generated
  # artefact validated against the official schema, on every commit, so a spec
  # change is a red build within days of publication rather than a support
  # ticket next quarter.
  #
  # Separate from `verify` on purpose. When this job goes red on a morning
  # nobody touched the code, the cause is upstream.
  artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: public/licenses NOTICE matches root NOTICE
        run: cmp NOTICE apps/web/public/licenses/NOTICE

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Cache Peppol BIS-3 Schematron
        uses: actions/cache@v4
        with:
          path: reference-data/peppol/bis-3/*.sch
          key: peppol-bis3-${{ hashFiles('tools/fetch-peppol-bis3.sh') }}

      - name: Fetch Peppol BIS-3 Schematron
        run: bash tools/fetch-peppol-bis3.sh

      - name: XAF 3.2 golden files validate against the published schema
        run: |
          for file in packages/core/test/xaf/__golden__/*.xml; do
            echo "validating $file"
            xmllint --noout --schema reference-data/xaf/XmlAuditfileFinancieel3.2.xsd "$file"
          done

      - name: Peppol BIS-3 Schematron is well formed
        run: |
          for file in reference-data/peppol/bis-3/*.sch; do
            echo "checking $file"
            xmllint --noout "$file"
          done

      - name: Reference data is well formed
        run: |
          node -e "
            const rgs = require('./reference-data/rgs/rgs-3.7-mkb.json');
            if (rgs.codes.length !== rgs.codeCount) throw new Error('RGS codeCount disagrees with contents');
            console.log('RGS ' + rgs.version + ' ' + rgs.variant + ': ' + rgs.codeCount + ' codes');
            for (const note of rgs.normalisations) console.log('  normalised: ' + note);
          "

  # Browser tests (spec 11.4). Sharded for wall-clock time; the required check is
  # still the aggregate job named `e2e` below. Path-filtered PRs that only touch
  # design/docs skip the heavy work but keep that gate green.
  e2e-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.set.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            e2e:
              - '**'
              - '!design/**'
              - '!docs/**'
              - '!prototypes/**'
              - '!**/*.md'
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=${{ steps.filter.outputs.e2e }}" >> "$GITHUB_OUTPUT"
          fi

  e2e-shard:
    name: e2e-shard (${{ matrix.shard }}/4)
    needs: e2e-changes
    if: needs.e2e-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: klopt
          POSTGRES_PASSWORD: klopt
          POSTGRES_DB: klopt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klopt -d klopt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Peppol BIS-3 Schematron
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reference-data/peppol/bis-3/*.sch
          key: peppol-bis3-${{ hashFiles('tools/fetch-peppol-bis3.sh') }}

      - name: Fetch Peppol BIS-3 Schematron
        run: pnpm run peppol:fetch

      - name: Build
        run: pnpm run build

      - name: Migrate
        run: pnpm --filter @klopt/db run migrate

      - name: Install Playwright browser
        run: pnpm --filter @klopt/web exec playwright install --with-deps chromium

      # Main suite only (midnight + fiscal-year run in their own jobs). Shard 1
      # still runs prod-pdf-check. All matrix jobs use vite dev (playwright.config
      # default); built-server matrix e2e is tracked in #228.
      - name: Playwright main suite (shard ${{ matrix.shard }}/4)
        working-directory: apps/web
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: |
          set -euo pipefail
          if [ "${{ matrix.shard }}" = "1" ]; then
            pnpm exec tsx scripts/prod-pdf-check.ts
          fi
          pnpm exec playwright test --shard=${{ matrix.shard }}/4 --reporter=blob,line

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 14
          if-no-files-found: error

  e2e-midnight:
    name: e2e-midnight
    needs: e2e-changes
    if: needs.e2e-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: klopt
          POSTGRES_PASSWORD: klopt
          POSTGRES_DB: klopt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klopt -d klopt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Migrate
        run: pnpm --filter @klopt/db run migrate

      - name: Install Playwright browser
        run: pnpm --filter @klopt/web exec playwright install --with-deps chromium

      - name: Playwright contacts-midnight
        working-directory: apps/web
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-midnight.zip
        run: pnpm exec playwright test --config playwright.contacts-midnight.config.ts --reporter=blob,line

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-blob-midnight
          path: apps/web/blob-report
          retention-days: 14
          if-no-files-found: error

  e2e-fiscal-year:
    name: e2e-fiscal-year
    needs: e2e-changes
    if: needs.e2e-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: klopt
          POSTGRES_PASSWORD: klopt
          POSTGRES_DB: klopt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klopt -d klopt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Migrate
        run: pnpm --filter @klopt/db run migrate

      - name: Install Playwright browser
        run: pnpm --filter @klopt/web exec playwright install --with-deps chromium

      - name: Playwright fiscal-year booking (#200)
        working-directory: apps/web
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-fiscal.zip
        run: pnpm exec playwright test -c playwright.fiscal-year-booking.config.ts --reporter=blob,line

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-blob-fiscal
          path: apps/web/blob-report
          retention-days: 14
          if-no-files-found: error

  e2e-merge-reports:
    name: e2e-merge-reports
    needs: [e2e-changes, e2e-shard, e2e-midnight, e2e-fiscal-year]
    if: always() && needs.e2e-changes.outputs.run == 'true' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download shard blobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: playwright-blob-*
          path: blob-reports
          merge-multiple: false

      - name: Merge Playwright reports
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p merged-blob-input
          i=0
          while IFS= read -r -d '' f; do
            if ! unzip -t "$f" >/dev/null; then
              echo "::error::Corrupt Playwright blob zip: $f"
              exit 1
            fi
            i=$((i + 1))
            cp "$f" "merged-blob-input/$(basename "$f")"
          done < <(find "$GITHUB_WORKSPACE/blob-reports" -type f -name '*.zip' -print0 | sort -z)
          if [ "$i" -lt 6 ]; then
            echo "::error::Expected at least 6 blob zips, found $i"
            find "$GITHUB_WORKSPACE/blob-reports" -type f
            exit 1
          fi
          pnpm exec playwright merge-reports --reporter html merged-blob-input

      - name: Upload merged Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

  e2e:
    needs: [e2e-changes, e2e-shard, e2e-midnight, e2e-fiscal-year, e2e-merge-reports]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required e2e gate
        env:
          CHANGES: ${{ needs.e2e-changes.result }}
          RUN_E2E: ${{ needs.e2e-changes.outputs.run }}
          SHARD: ${{ needs.e2e-shard.result }}
          MIDNIGHT: ${{ needs.e2e-midnight.result }}
          FISCAL: ${{ needs.e2e-fiscal-year.result }}
          MERGE: ${{ needs.e2e-merge-reports.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "::error title=e2e::e2e-changes did not succeed (result=$CHANGES); refusing a green gate with zero tests."
            exit 1
          fi
          if [ "$RUN_E2E" = "false" ]; then
            echo "e2e skipped: only design/, docs/, prototypes/, or *.md changed."
            exit 0
          fi
          if [ "$RUN_E2E" != "true" ]; then
            echo "::error title=e2e::unexpected e2e-changes output run=${RUN_E2E:-<empty>}"
            exit 1
          fi
          failed=0
          for name in shard midnight fiscal merge; do
            case "$name" in
              shard) result=$SHARD ;;
              midnight) result=$MIDNIGHT ;;
              fiscal) result=$FISCAL ;;
              merge) result=$MERGE ;;
            esac
            case "$result" in
              success) ;;
              *)
                echo "::error title=e2e::$name job result was $result"
                failed=1
                ;;
            esac
          done
          exit "$failed"
