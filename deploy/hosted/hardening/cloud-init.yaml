#cloud-config
# First boot on the Elastic Metal box (Ubuntu 24.04). Placeholders only.
# Paste as Scaleway user-data, or: cloud-init once from a local copy.
#
# This is host hardening for one private instance. It does not provision
# tenants or a control plane.

hostname: klopt-hidde
manage_etc_hosts: true

users:
  - name: klopt
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 REPLACE_WITH_HIDDE_ED25519_KEY klopt-hidde

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  - ca-certificates
  - curl
  - gnupg
  - jq
  - git

write_files:
  - path: /etc/ssh/sshd_config.d/99-klopt-hardening.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no
      X11Forwarding no
      AllowTcpForwarding no
      AllowUsers klopt
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      mode = aggressive
      port = ssh
      filter = sshd
      maxretry = 4
      bantime = 1h
      findtime = 10m

runcmd:
  - mkdir -p /opt/klopt
  - chown klopt:klopt /opt/klopt
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin docker-buildx-plugin
  - usermod -aG docker klopt
  - systemctl enable --now docker fail2ban unattended-upgrades
  - systemctl reload ssh || systemctl reload sshd

final_message: "Klopt host bootstrap finished. Log in as klopt with the SSH key. Docker is the unprivileged user's."
